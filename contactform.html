<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      padding: 2rem;
      background-color: #f9f9f9;
    }

    .contact-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .contact-form {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .contact-form h2 {
      margin-bottom: 1rem;
      text-align: center;
      color: #93b81c;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      resize: none;
    }

    .contact-form button {
      background-color: #93b81c;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    .contact-form button:hover {
      background-color: #aed729;
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <form id="contactForm" class="contact-form">
      <h2>Contact Us</h2>
      <h3><a href="index.html" style="text-decoration: none;padding-bottom:20px;color: #ccc;">Back to HomePage</a></h3>
      <input type="text" name="name" placeholder="Your Name" required >
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Leave Us the Message!" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();
      const name = this.elements["name"].value;
      alert(`Thank you, ${name}! Your message has been submitted.`);
      this.reset();
    });
  </script>
  

</body>
</html>
